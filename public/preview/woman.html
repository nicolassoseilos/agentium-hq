<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentium HQ — guest preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1714; color: #f3ece1; font-family: Manrope, system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 8px; }
    .bar button { background: rgba(20,16,12,.8); color: #f3ece1; border: 1px solid rgba(210,174,114,.4); border-radius: 999px; padding: 9px 16px; font: 600 13px Manrope, sans-serif; cursor: pointer; }
    .bar button.on { border-color: #d2ae72; color: #d2ae72; }
    .tag { position: fixed; left: 20px; top: 16px; font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: #a99c89; }
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <div class="tag">Rooftop guest · preview</div>
  <div class="bar"><button data-v="front" class="on">Front</button><button data-v="back">Back</button><button data-v="side">Side</button><button data-v="face">Face</button></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { buildHair, buildBrowsAndLashes, poseRelaxed, upgradeMaterials } from '../js/scene/woman.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#d9d2c8');
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.55;
    const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.05, 50);

    const key = new THREE.DirectionalLight('#fff3e6', 2.6);
    key.position.set(1.5, 3, 3);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);
    const rim = new THREE.DirectionalLight('#ffe2c2', 1.6);
    rim.position.set(-2, 2.5, -2.5);
    scene.add(rim);
    scene.add(new THREE.HemisphereLight('#ffffff', '#8a7a68', 0.6));
    const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.MeshStandardMaterial({ color: '#cfc6b8', roughness: 0.8 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const q = new URLSearchParams(location.search);
    const gltf = await new GLTFLoader().loadAsync(q.get('model') || '../models/guest-a.glb');
    const woman = gltf.scene;
    scene.add(woman);
    woman.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
    upgradeMaterials(woman);
    const info = woman.getObjectByName('Woman').userData;
    // stand on the floor
    const box = new THREE.Box3().setFromObject(woman.getObjectByName('body'));
    woman.position.y = -box.min.y;
    buildBrowsAndLashes(woman, info, { color: info.hairColor });
    poseRelaxed(woman);
    buildHair(woman, info, { style: q.get('hair') || 'long-wavy', color: info.hairColor });

    const eye = new THREE.Vector3(...info.eyes[0]).add(new THREE.Vector3(...info.eyes[1])).multiplyScalar(0.5).add(woman.position);
    const mid = eye.y * 0.52;
    const views = {
      front: { pos: [0, mid + 0.05, 4.6], look: [0, mid, 0] },
      back: { pos: [0, mid + 0.05, -4.6], look: [0, mid, 0] },
      side: { pos: [4.6, mid + 0.05, 0.4], look: [0, mid, 0] },
      face: { pos: [eye.x, eye.y - 0.02, eye.z + 0.62], look: [eye.x, eye.y - 0.035, eye.z] },
    };
    function setView(v) {
      const s = views[v];
      camera.position.set(...s.pos);
      camera.lookAt(...s.look);
      camera.fov = v === 'face' ? 26 : 28;
      camera.updateProjectionMatrix();
      document.querySelectorAll('.bar button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
    }
    document.querySelector('.bar').addEventListener('click', (e) => e.target.dataset.v && setView(e.target.dataset.v));
    setView(q.get('view') || 'front');
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
    window.__w = { woman, scene, camera, setView };
  </script>
</body>
</html>
