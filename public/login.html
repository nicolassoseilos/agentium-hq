<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Agentium HQ</title>
  <link rel="icon" href="/login-assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a46a;
      --gold-soft: rgba(201, 164, 106, .35);
      --ink: #f3ece1;
      --muted: #a89b88;
      --panel: rgba(20, 15, 11, .72);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 70% 15%, rgba(214, 150, 80, .22), transparent 60%),
        radial-gradient(900px 600px at 15% 90%, rgba(60, 90, 140, .25), transparent 60%),
        linear-gradient(180deg, #120d0a 0%, #1b140f 55%, #0b0907 100%);
      display: grid;
      place-items: center;
      padding: 16px;
    }
    /* faint window mullions, like standing in the penthouse at dusk */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        repeating-linear-gradient(90deg, transparent 0 calc(25% - 2px), rgba(0,0,0,.35) calc(25% - 2px) 25%),
        linear-gradient(180deg, rgba(0,0,0,.35) 0 6%, transparent 6% 94%, rgba(0,0,0,.4) 94%);
      pointer-events: none;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: 40px 34px 30px;
      background: var(--panel);
      border: 1px solid var(--gold-soft);
      border-radius: 6px;
      backdrop-filter: blur(14px);
      box-shadow: 0 40px 120px rgba(0,0,0,.55);
    }
    .mark { display: block; width: 56px; height: 56px; margin: 0 auto 18px; }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: 30px;
      letter-spacing: .32em;
      text-align: center;
      margin: 0;
      padding-left: .32em;
    }
    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      margin: 8px 0 30px;
    }
    label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    input {
      width: 100%;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(201,164,106,.28);
      border-radius: 4px;
      padding: 12px 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    input:focus { border-color: var(--gold); background: rgba(255,255,255,.07); }
    button {
      width: 100%;
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #1a130c;
      background: linear-gradient(180deg, #dcbb85, #b98f52);
      border: 0;
      border-radius: 4px;
      padding: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { filter: brightness(1.06); }
    .err { color: #f0a08a; font-size: 13px; text-align: center; margin: -10px 0 18px; min-height: 0; }
    .foot { text-align: center; color: #6f6455; font-size: 11px; margin-top: 22px; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="/login-assets/mark.svg" alt="">
    <h1>AGENTIUM</h1>
    <p class="sub">Headquarters · Private</p>
    <p class="err" id="err" hidden></p>
    <form method="post" action="/login" autocomplete="on">
      <label for="username">Name</label>
      <input id="username" name="username" type="text" autocomplete="username" value="agentium-ceo" required autocapitalize="off" spellcheck="false">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Enter HQ</button>
    </form>
    <p class="foot">This device stays signed in.</p>
  </main>
  <script src="/login-assets/login.js"></script>
</body>
</html>
