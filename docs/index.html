<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0b09">
  <title>Agentium HQ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style id="gate-style">
    :root { --gold: #c9a46a; --gold-soft: rgba(201,164,106,.35); --ink: #f3ece1; --muted: #a89b88; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body.gate {
      font-family: Manrope, system-ui, sans-serif; color: var(--ink);
      background:
        radial-gradient(1200px 700px at 70% 15%, rgba(214,150,80,.22), transparent 60%),
        radial-gradient(900px 600px at 15% 90%, rgba(60,90,140,.25), transparent 60%),
        linear-gradient(180deg, #120d0a 0%, #1b140f 55%, #0b0907 100%);
      display: grid; place-items: center; padding: 16px;
    }
    body.gate::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background:
        repeating-linear-gradient(90deg, transparent 0 calc(25% - 2px), rgba(0,0,0,.35) calc(25% - 2px) 25%),
        linear-gradient(180deg, rgba(0,0,0,.35) 0 6%, transparent 6% 94%, rgba(0,0,0,.4) 94%);
    }
    .card {
      position: relative; width: 100%; max-width: 380px; padding: 40px 34px 30px;
      background: rgba(20,15,11,.72); border: 1px solid var(--gold-soft); border-radius: 6px;
      backdrop-filter: blur(14px); box-shadow: 0 40px 120px rgba(0,0,0,.55);
    }
    .mark { display: block; width: 56px; height: 56px; margin: 0 auto 18px; }
    body.gate h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 30px; letter-spacing: .32em; text-align: center; margin: 0; padding-left: .32em; }
    .sub { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; margin: 8px 0 30px; }
    body.gate label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    body.gate input {
      width: 100%; font: inherit; font-size: 15px; color: var(--ink);
      background: rgba(255,255,255,.04); border: 1px solid rgba(201,164,106,.28); border-radius: 4px;
      padding: 12px 14px; margin-bottom: 18px; outline: none; transition: border-color .2s, background .2s;
    }
    body.gate input:focus { border-color: var(--gold); background: rgba(255,255,255,.07); }
    body.gate button {
      width: 100%; font: inherit; font-weight: 600; font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
      color: #1a130c; background: linear-gradient(180deg, #dcbb85, #b98f52); border: 0; border-radius: 4px;
      padding: 13px; cursor: pointer; margin-top: 4px;
    }
    body.gate button:disabled { opacity: .6; cursor: progress; }
    .err { color: #f0a08a; font-size: 13px; text-align: center; margin: -10px 0 18px; }
    .foot { text-align: center; color: #6f6455; font-size: 11px; margin-top: 22px; letter-spacing: .08em; }
    .opening { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; }
  </style>
</head>
<body class="gate">
  <main class="card" id="gate" hidden>
    <img class="mark" src="favicon.svg" alt="">
    <h1>AGENTIUM</h1>
    <p class="sub">Headquarters · Private</p>
    <p class="err" id="err" hidden></p>
    <form id="login" autocomplete="on">
      <label for="username">Name</label>
      <input id="username" name="username" type="text" autocomplete="username" value="agentium-ceo" required autocapitalize="off" spellcheck="false">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="go">Enter HQ</button>
    </form>
    <p class="foot">This device stays signed in.</p>
  </main>
  <p class="opening" id="opening">Opening headquarters</p>

<!-- ?v= = the module's version: bump it whenever docs/live/*.js changes, or browsers keep the old copy for 10 min.
     Live data (team-build session, 19 Nov 2026): only defines window.AHQ_LIVE; the HQ starts it after sign-in. -->
<script src="live/hq-live.js?v=2026-11-21d"></script>
<!-- The rooftop DJ plays real music from Nicolas's Spotify (team-build session, 20 Nov 2026): only defines window.AHQ_MUSIC. -->
<script src="live/hq-music.js?v=2026-11-20b"></script>
<script>
// Agentium HQ gate. The whole HQ is stored encrypted in app.bin (AES-256-GCM).
// The key is derived from the name + password (PBKDF2-SHA256), so without the
// password there is nothing to see. After the first sign-in the key is kept on
// this device, so it never asks again. Visit with #signout to forget it.
(async () => {
  const STORE = 'agentium-hq-key';
  const $ = (id) => document.getElementById(id);
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  if (location.hash === '#signout') {
    try { localStorage.removeItem(STORE); } catch {}
    history.replaceState(null, '', location.pathname);
  }

  let blob;
  try {
    const res = await fetch('app.bin', { cache: 'no-cache' });
    blob = new Uint8Array(await res.arrayBuffer());
  } catch {
    $('opening').textContent = 'Could not reach the HQ. Check your connection and reload.';
    return;
  }
  const magic = new TextDecoder().decode(blob.slice(0, 4));
  if (magic !== 'AHQ1') { $('opening').textContent = 'This HQ build is damaged. Please rebuild it.'; return; }
  const view = new DataView(blob.buffer);
  const salt = blob.slice(4, 20);
  const iv = blob.slice(20, 32);
  const iterations = view.getUint32(32);
  const data = blob.slice(36);

  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(stream).text());
  }

  async function boot(app, key) {
    window.__AHQ_KEY = key; // lets the HQ decrypt its 3D models
    document.getElementById('gate-style')?.remove(); // the gate's styles must not leak into the HQ
    const style = document.createElement('style');
    style.textContent = app.css;
    document.head.appendChild(style);
    document.body.className = '';
    document.body.innerHTML = app.html;
    const url = URL.createObjectURL(new Blob([app.js], { type: 'text/javascript' }));
    await import(url);
  }

  // 1. remembered device
  try {
    const saved = localStorage.getItem(STORE);
    if (saved) {
      const key = await crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', false, ['decrypt']);
      const app = await open(key);
      return boot(app, key);
    }
  } catch {
    try { localStorage.removeItem(STORE); } catch {}
  }

  // 2. sign in
  $('opening').hidden = true;
  $('gate').hidden = false;
  $('login').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('go').disabled = true;
    $('go').textContent = 'Opening…';
    $('err').hidden = true;
    try {
      const secret = new TextEncoder().encode(`${$('username').value.trim()}\n${$('password').value}`);
      const base = await crypto.subtle.importKey('raw', secret, 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      const app = await open(key);
      try { localStorage.setItem(STORE, b64(await crypto.subtle.exportKey('raw', key))); } catch {}
      await boot(app, key);
    } catch {
      $('err').textContent = 'That name and password did not match.';
      $('err').hidden = false;
      $('go').disabled = false;
      $('go').textContent = 'Enter HQ';
    }
  });
})();
</script>
</body>
</html>
